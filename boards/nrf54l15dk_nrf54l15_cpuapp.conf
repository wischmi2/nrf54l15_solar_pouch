# No 32.768 kHz crystal on this board. The DK default (LFXO) makes GRTC
# wait forever, so main() never runs.
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_NRF_GRTC_TIMER_SOURCE_LFLPRC=y

# nPM1300 charger and status LED, same stack as the bring-up firmware.
CONFIG_I2C=y
CONFIG_GPIO=y
CONFIG_MFD=y
CONFIG_REGULATOR=y
CONFIG_SENSOR=y
CONFIG_NPM13XX_CHARGER=y
CONFIG_LED=y
CONFIG_LED_NPM13XX=y
